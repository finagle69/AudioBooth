name: Check patch against upstream

# Runs every Monday and can also be started by hand. It tests whether
# patches/bluetooth-timeline.patch still applies to the newest code on
# AudioBooth's main branch. If it does not, this run FAILS, and GitHub
# emails you about the failed run. Nothing is built or changed.
on:
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test patch against upstream main
        run: |
          git clone --quiet https://github.com/AudioBooth/AudioBooth.git upstream
          cd upstream
          echo "Upstream main is at: $(git log -1 --format='%h %cs %s')" >> "$GITHUB_STEP_SUMMARY"
          if git apply --check --ignore-whitespace ../patches/bluetooth-timeline.patch; then
            echo "OK: patch applies to upstream main" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Patch does NOT apply to upstream main. Ask Claude to update it."
            echo "FAIL: patch does not apply to upstream main" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
